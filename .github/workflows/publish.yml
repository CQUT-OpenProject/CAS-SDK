name: Publish SDK
on:
  push:
    branches: [master]
    tags: ["release-*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-sdk
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@cqut-openproject"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: vp install --frozen-lockfile
      - run: vp run build
      - name: Prepare release artifact and validate version
        env:
          SOURCE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          ARTIFACT_DIR=$(mktemp -d)
          VERSION_TAG=$(node scripts/prepare-release.mjs "$ARTIFACT_DIR" "$SOURCE_TAG")
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          if [ -n "$SOURCE_TAG" ]; then
            REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$VERSION_TAG")
            if [ -n "$REMOTE_TAG" ]; then
              echo "Artifact version tag already exists"
              exit 1
            fi
          fi
      - name: Publish versioned package
        if: startsWith(github.ref, 'refs/tags/release-')
        run: vp pm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push installable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/release-') }}
        run: |
          cd "$ARTIFACT_DIR"
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🚀 发布 SDK 构建产物"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$IS_RELEASE" = "true" ]; then
            git tag "$VERSION_TAG"
            git push origin "refs/tags/$VERSION_TAG"
          else
            git push origin release --force
          fi
